<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found</title><style>body{margin:0;font-family:Georgia,serif;background:#0E3B33;color:#F7F4EE;display:grid;place-items:center;min-height:100vh;text-align:center}h1{font-size:5rem;margin:0;color:#C89B3C}p{color:#C9D2CB;max-width:40ch;margin:1rem auto 2rem;font-family:system-ui}a{display:inline-block;background:#C89B3C;color:#231a08;text-decoration:none;padding:.8rem 1.6rem;border-radius:999px;font-weight:700;font-family:system-ui;margin:.3rem}a.alt{background:transparent;border:1.5px solid #C89B3C;color:#C89B3C}</style></head><body><div><h1>404</h1><p>The page you are looking for has moved or does not exist.</p><a id="home" href="#">Back home</a><a id="map" class="alt" href="#">Site map</a><a id="contact" class="alt" href="#">Contact</a></div><script>var seg=location.pathname.split("/").filter(Boolean);var base=(location.hostname.endsWith("github.io")&&seg.length)?"/"+seg[0]+"/":"/";document.getElementById("home").href=base;document.getElementById("map").href=base+"site-map/";document.getElementById("contact").href=base+"contact/";</script></body></html>
